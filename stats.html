<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K9 Analytics Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #080f1e;
      --bg2:    #0d1830;
      --bg3:    #111e38;
      --accent: #4db8ff;
      --green:  #22c55e;
      --red:    #f87171;
      --text1:  #f0f6ff;
      --text2:  #94a3c0;
      --text3:  #5a6a85;
      --border: rgba(77,184,255,.12);
      --radius: 16px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text1);
      min-height: 100vh; padding: 40px 24px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 40px;
    }
    header h1 { font-size: 22px; font-weight: 700; }
    header a { color: var(--text3); text-decoration: none; font-size: 13px; }
    header a:hover { color: var(--accent); }

    .stat-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 40px;
    }
    .stat-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
    }
    .stat-label { font-size: 12px; color: var(--text3); text-transform: uppercase;
      letter-spacing: .5px; margin-bottom: 8px; }
    .stat-value { font-size: 40px; font-weight: 800; color: var(--accent); }
    .stat-value.green { color: var(--green); }

    .chart-section { margin-bottom: 40px; }
    .chart-section h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--text2); }

    .chart-wrap {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; overflow-x: auto;
    }
    .bars {
      display: flex; align-items: flex-end; gap: 4px;
      height: 140px; min-width: 600px;
    }
    .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .bar-col { display: flex; gap: 2px; align-items: flex-end; height: 110px; }
    .bar {
      width: 10px; border-radius: 3px 3px 0 0;
      transition: opacity .2s; cursor: default; min-height: 2px;
    }
    .bar.views { background: var(--accent); opacity: .7; }
    .bar.downloads { background: var(--green); }
    .bar-date { font-size: 9px; color: var(--text3); writing-mode: vertical-rl;
      text-orientation: mixed; transform: rotate(180deg); margin-top: 6px; }

    .legend { display: flex; gap: 20px; margin-top: 16px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; }
    .legend-dot.views { background: var(--accent); opacity: .7; }
    .legend-dot.downloads { background: var(--green); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: var(--text3); font-weight: 600;
      font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
      padding: 0 12px 12px; border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.04); color: var(--text2); }
    td:first-child { color: var(--text1); font-variant-numeric: tabular-nums; }
    td.num { font-variant-numeric: tabular-nums; color: var(--text1); }
    tr:hover td { background: rgba(77,184,255,.03); }
    tr:last-child td { border-bottom: none; }

    .loading { color: var(--text3); text-align: center; padding: 60px; }
    .error-msg { color: var(--red); text-align: center; padding: 40px; }

    .refresh-btn {
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text2); font-size: 12px; padding: 6px 14px;
      border-radius: 8px; cursor: pointer; transition: color .2s;
    }
    .refresh-btn:hover { color: var(--accent); }

    @media (max-width: 600px) {
      body { padding: 24px 16px; }
      .stat-value { font-size: 32px; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>K9 Analytics</h1>
    <div style="display:flex;gap:12px;align-items:center;">
      <button class="refresh-btn" onclick="load()">Refresh</button>
      <a href="/">← Back to site</a>
    </div>
  </header>

  <div id="root"><p class="loading">Loading analytics…</p></div>
</div>

<script>
async function load() {
  const root = document.getElementById('root');
  root.innerHTML = '<p class="loading">Loading analytics…</p>';
  try {
    const res = await fetch('/api/stats');
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    render(data);
  } catch (e) {
    root.innerHTML = `<p class="error-msg">Failed to load analytics: ${e.message}</p>`;
  }
}

function render({ totals, daily }) {
  const maxViews = Math.max(...daily.map(d => d.views), 1);
  const maxDownloads = Math.max(...daily.map(d => d.downloads), 1);
  const maxVal = Math.max(maxViews, maxDownloads, 1);

  const convRate = totals.views > 0
    ? ((totals.downloads / totals.views) * 100).toFixed(1)
    : '0.0';

  const bars = daily.map(d => `
    <div class="bar-group">
      <div class="bar-col">
        <div class="bar views" style="height:${Math.max(2, (d.views/maxVal)*110)}px" title="${d.date}: ${d.views} views"></div>
        <div class="bar downloads" style="height:${Math.max(d.downloads > 0 ? 2 : 0, (d.downloads/maxVal)*110)}px" title="${d.date}: ${d.downloads} downloads"></div>
      </div>
      <div class="bar-date">${d.date.slice(5)}</div>
    </div>
  `).join('');

  const rows = [...daily].reverse().filter(d => d.views > 0 || d.downloads > 0).map(d => `
    <tr>
      <td>${d.date}</td>
      <td class="num">${d.views.toLocaleString()}</td>
      <td class="num">${d.downloads.toLocaleString()}</td>
      <td class="num">${d.views > 0 ? ((d.downloads/d.views)*100).toFixed(1)+'%' : '—'}</td>
    </tr>
  `).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:32px">No data yet — visit the site to start tracking.</td></tr>';

  document.getElementById('root').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Total Page Views</div>
        <div class="stat-value">${totals.views.toLocaleString()}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Downloads</div>
        <div class="stat-value green">${totals.downloads.toLocaleString()}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Conversion Rate</div>
        <div class="stat-value">${convRate}%</div>
      </div>
    </div>

    <div class="chart-section">
      <h2>Last 30 Days</h2>
      <div class="chart-wrap">
        <div class="bars">${bars}</div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot views"></div>Page Views</div>
          <div class="legend-item"><div class="legend-dot downloads"></div>Downloads</div>
        </div>
      </div>
    </div>

    <div class="chart-wrap">
      <table>
        <thead><tr><th>Date</th><th>Views</th><th>Downloads</th><th>Conv. Rate</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

load();
</script>
</body>
</html>
